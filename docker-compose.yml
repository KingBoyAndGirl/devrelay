version: '3.8'

services:
  devrelay:
    build: .
    container_name: devrelay
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/devrelay.db
      - DATA_DIR=/data
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-to-random-string}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-devrelay2026}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3000/api/auth/callback/github}
      - DEVRELAY_AGENT_URL=${DEVRELAY_AGENT_URL:-http://host.docker.internal:4100}
      - DEVRELAY_AGENT_TOKEN=${DEVRELAY_AGENT_TOKEN:-}
    restart: unless-stopped
